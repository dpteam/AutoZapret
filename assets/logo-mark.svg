<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="AutoZapret">
  <!--
    Прозрачная версия знака — для README и тёмных/светлых тем.

    Геометрия и цвета те же, что в logo.svg и в
    android/.../drawable/ic_launcher_foreground.xml. Отличие одно: нет
    подложки-квадрата, потому что на GitHub фон страницы то белый, то тёмный,
    и глухой прямоугольник смотрится заплаткой.

    Чтобы жёлтая стрелка читалась и на белом, стена сделана чуть темнее,
    чем в иконке приложения (#3A4761 вместо #4A5878): на белом фоне
    #4A5878 слишком светлый и обломки «исчезают».
  -->
  <g transform="translate(256 256) scale(5.0) translate(-55 -54)">
    <!-- верхний обломок стены -->
    <path d="M41,26 L50,26 L50,41 L41,46 Z" fill="#3A4761"/>

    <!-- нижний обломок -->
    <path d="M41,62 L50,57 L50,82 L41,82 Z" fill="#3A4761"/>

    <!-- древко стрелки -->
    <path d="M19,49 L67,49 L67,59 L19,59 Z" fill="#F0B429"/>

    <!-- наконечник -->
    <path d="M65,39 L91,54 L65,69 Z" fill="#F0B429"/>
  </g>
</svg>
