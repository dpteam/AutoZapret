<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="AutoZapret">
  <!--
    Единый знак проекта: стрелка проходит сквозь разбитую стену.

    Геометрия взята ОДИН В ОДИН из android/AutoZapret.Android/Resources/
    drawable/ic_launcher_foreground.xml (viewport 108). Менять здесь и там
    по отдельности нельзя: иконка на телефоне, значок exe и логотип в README
    должны быть одним знаком, иначе это три разных продукта.

    Почему такой знак, а не замок: первый вариант (разорванный замок с
    зигзагом) в мелком размере превращался в мутное пятно — три формы,
    зубчатый край, тонкие линии. В трее это читается как «что-то сломалось»,
    а не как логотип. Здесь три простые фигуры и один смысл: препятствие
    есть, трафик его проходит. Силуэт узнаётся на 16 px.

    Цвета — ровно те же, что в values/ic_launcher_background.xml и палитре UI.
  -->
  <defs>
    <clipPath id="round">
      <rect x="0" y="0" width="512" height="512" rx="112"/>
    </clipPath>
  </defs>

  <!-- фон: скруглённый квадрат, как у иконки приложения -->
  <g clip-path="url(#round)">
    <rect x="0" y="0" width="512" height="512" fill="#131A2E"/>

    <!-- Знак: viewport 108 -> масштаб 5.0 вокруг центра знака (55, 54).
         Знак занимает 72 из 108 единиц, то есть 360 px из 512 (~70 %) —
         столько же, сколько на иконке приложения в безопасной зоне. -->
    <g transform="translate(256 256) scale(5.0) translate(-55 -54)">

      <!-- верхний обломок стены: нижняя грань скошена, как у скола -->
      <path d="M41,26 L50,26 L50,41 L41,46 Z" fill="#4A5878"/>

      <!-- нижний обломок: верхняя грань скошена в другую сторону -->
      <path d="M41,62 L50,57 L50,82 L41,82 Z" fill="#4A5878"/>

      <!-- древко стрелки -->
      <path d="M19,49 L67,49 L67,59 L19,59 Z" fill="#F0B429"/>

      <!-- наконечник -->
      <path d="M65,39 L91,54 L65,69 Z" fill="#F0B429"/>
    </g>
  </g>

  <!-- тонкая рамка: без неё на светлом фоне край иконки теряется -->
  <rect x="3" y="3" width="506" height="506" rx="110" fill="none"
        stroke="#1B2035" stroke-width="6"/>
</svg>
