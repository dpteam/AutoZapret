name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to attach the release to (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  release:
    runs-on: windows-latest

    # Тот же таймаут, что и в build.yml: очередь GitHub иногда залипает.
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Cache WebView2 SDK
        id: cache-webview2
        uses: actions/cache@v4
        with:
          path: lib/webview2
          key: webview2-sdk-1.0.4314.35

      - name: Fetch WebView2 SDK
        if: steps.cache-webview2.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./tools/fetch-webview2.ps1

      # Версия берётся из тега, а не из csproj.
      #
      # Почему это обязательно: самообновление сравнивает установленную версию
      # с тегом релиза. Если собрать v0.3.0 с <Version>0.2.0</Version> из csproj,
      # exe навсегда рапортует 0.2.0 — приложение будет предлагать обновиться
      # до 0.3.0, обновляться и снова видеть 0.2.0. Бесконечный цикл.
      - name: Resolve version from tag
        id: version
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          $v = $tag.TrimStart('v', 'V')

          if ($v -notmatch '^\d+\.\d+\.\d+$') {
            throw "tag '$tag' is not a version (expected v1.2.3)"
          }

          Write-Host "version: $v (from tag $tag)"
          "value=$v" >> $env:GITHUB_OUTPUT
          "numeric=$v.0" >> $env:GITHUB_OUTPUT

      - name: Build
        shell: pwsh
        run: |
          dotnet build AutoZapret.csproj -c Release -v minimal --nologo `
            -p:Version=${{ steps.version.outputs.value }} `
            -p:FileVersion=${{ steps.version.outputs.numeric }} `
            -p:AssemblyVersion=${{ steps.version.outputs.numeric }}
          if ($LASTEXITCODE -ne 0) { throw "build failed" }

      - name: Selftest
        shell: pwsh
        run: |
          Push-Location bin
          try {
            $p = Start-Process -FilePath ./AutoZapret.exe -ArgumentList '--selftest' -Wait -PassThru -NoNewWindow
            if (Test-Path selftest.txt) { Get-Content selftest.txt -Encoding UTF8 | Write-Host }
            if ($p.ExitCode -ne 0) { throw "selftest failed" }
          } finally { Pop-Location }

      # Без стратегий релиз бесполезен: это половина продукта.
      - name: Verify strategies and licenses
        shell: pwsh
        run: |
          foreach ($f in @('assets/strategies/strategies.v1.json','assets/strategies/strategies.v2.json')) {
            if (-not (Test-Path $f)) { throw "missing $f" }
            $n = @((Get-Content $f -Raw -Encoding UTF8 | ConvertFrom-Json).strategies).Count
            Write-Host "$f : $n"
            if ($n -lt 20) { throw "$f has only $n strategies" }
          }

          foreach ($f in @('LICENSE','licenses/README.md','licenses/zapret-MIT.txt',
                           'licenses/flowseal-MIT.txt','licenses/WinDivert-LGPLv3.txt',
                           'licenses/zapret-custom-binaries-MIT.txt',
                           'assets/fakes/fakes.json')) {
            if (-not (Test-Path $f)) { throw "missing $f - обязательный файл поставки" }
          }

      # portable-архив: self-contained exe (.NET внутри) + loader + ассеты + ЛИЦЕНЗИИ
      #
      # Движок обязателен: без engine\ приложение запускается и показывает
      # «Движок не установлен». Раньше пакет собирался БЕЗ него, а README внутри
      # предлагал запустить tools\fetch-engine.ps1 — которого в пакете тоже нет.
      - name: Fetch engine
        shell: pwsh
        run: |
          ./tools/fetch-engine.ps1
          if (-not (Test-Path 'engine/bin/winws.exe')) {
            throw "engine not fetched - the portable package would be useless without it"
          }

      - name: Publish self-contained
        shell: pwsh
        run: |
          dotnet publish AutoZapret.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true `
            -p:EnableCompressionInSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:Version=${{ steps.version.outputs.value }} `
            -p:FileVersion=${{ steps.version.outputs.numeric }} `
            -p:AssemblyVersion=${{ steps.version.outputs.numeric }} `
            -p:DebugType=none -v minimal --nologo -o publish
          if ($LASTEXITCODE -ne 0) { throw "publish failed" }
          Copy-Item 'lib/webview2/WebView2Loader.dll' 'publish/' -Force

          # версия внутри опубликованного exe должна совпасть с тегом
          $p = Start-Process -FilePath ./publish/AutoZapret.exe -ArgumentList '--version' -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "published exe --version failed" }

      - name: Assemble portable package
        shell: pwsh
        run: |
          $stage = 'stage/AutoZapret'
          New-Item -ItemType Directory -Path $stage -Force | Out-Null

          Copy-Item 'publish/AutoZapret.exe'      $stage
          Copy-Item 'publish/WebView2Loader.dll'  $stage

          # ассеты и стратегии - часть продукта, без них приложение пустое
          Copy-Item 'assets' $stage -Recurse -Force

          # движок идёт ВНУТРЬ пакета: обещание «скачал и работает» иначе ложь
          if (Test-Path 'engine/bin/winws.exe') {
            New-Item -ItemType Directory -Path (Join-Path $stage 'engine') -Force | Out-Null
            robocopy engine (Join-Path $stage 'engine') /E /XO /NJH /NJS /NDL /NFL /NP /R:1 /W:1 | Out-Null
            # robocopy: 0-7 успех, 8+ ошибка
            if ($LASTEXITCODE -ge 8) { throw "engine copy failed with $LASTEXITCODE" }
            $global:LASTEXITCODE = 0
          } else {
            throw "engine missing - refusing to publish a package that cannot work"
          }

          # скрипт обновления движка кладём рядом, иначе README отправляет в пустоту
          New-Item -ItemType Directory -Path (Join-Path $stage 'tools') -Force | Out-Null
          Copy-Item 'tools/fetch-engine.ps1' (Join-Path $stage 'tools') -Force
          # лицензии обязательны (MIT/LGPL требования)
          Copy-Item 'LICENSE'   $stage -Force
          Copy-Item 'licenses'  $stage -Recurse -Force
          if (Test-Path 'README.md') { Copy-Item 'README.md' $stage -Force }

          # движок zapret НЕ шипим (ROADMAP §P1): качается tools\fetch-engine.ps1
          #
          # ВАЖНО: здесь массив строк, а не here-string (@' ... '@).
          # В YAML содержимое run: | обязано быть с отступом, а закрывающий '@
          # в PowerShell обязан быть в нулевой колонке - вместе это ломает YAML.
          $readme = @(
            'AutoZapret - portable',
            '',
            '1. Распакуйте в папку без кириллицы в пути (например C:\AutoZapret).',
            '2. Если скачивали через браузер: правый клик по архиву -> Свойства -> Разблокировать.',
            '3. Запустите AutoZapret.exe, согласитесь на UAC.',
            '',
            '.NET устанавливать НЕ нужно: он вшит в exe.',
            'Нужен только Microsoft Edge WebView2 Runtime (в Windows 11 уже есть,',
            'для Windows 10 - https://go.microsoft.com/fwlink/p/?LinkId=2124703).',
            '',
            'Движок обхода DPI (zapret) уже внутри, в папке engine\.',
            'Ничего скачивать не нужно.',
            '',
            'Обновить движок отдельно:',
            '    powershell -ExecutionPolicy Bypass -File tools\fetch-engine.ps1',
            '',
            'Это не VPN. WinDivert может вызвать реакцию антивируса - это ожидаемо.',
            '',
            'Требуется: Windows 10 1607+ / Windows 11, x64.'
          ) -join "`r`n"

          Set-Content -Path (Join-Path $stage 'ПРОЧТИ-МЕНЯ.txt') -Value $readme -Encoding UTF8

          Compress-Archive -Path "$stage/*" -DestinationPath 'AutoZapret-portable.zip' -Force
          $mb = [int]((Get-Item 'AutoZapret-portable.zip').Length / 1MB)
          Write-Host "package: $mb MB"
          if ($mb -lt 20) { throw "package too small ($mb MB)" }

          # проверяем содержимое архива, а не только размер
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path 'AutoZapret-portable.zip'))
          try {
            $names = $zip.Entries | ForEach-Object { $_.FullName.Replace('\','/') }
            foreach ($need in @('AutoZapret/AutoZapret.exe',
                                'AutoZapret/WebView2Loader.dll',
                                'AutoZapret/assets/strategies/strategies.v1.json',
                                'AutoZapret/assets/fakes/fakes.json',
                                'AutoZapret/engine/bin/winws.exe',
                                'AutoZapret/engine/bin/WinDivert64.sys',
                                'AutoZapret/tools/fetch-engine.ps1',
                                'AutoZapret/LICENSE',
                                'AutoZapret/licenses/zapret-MIT.txt',
                                'AutoZapret/licenses/zapret-custom-binaries-MIT.txt',
                                'AutoZapret/licenses/WinDivert-LGPLv3.txt')) {
              if (-not ($names -contains $need)) { throw "в архиве нет $need" }
            }
            Write-Host "содержимое архива проверено: $($names.Count) файлов"
          } finally { $zip.Dispose() }

      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem -Filter 'AutoZapret-portable.zip' | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$h  $($_.Name)" | Out-File -FilePath 'checksums.txt' -Encoding ASCII
            Write-Host "$h  $($_.Name)"
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: win-portable-release
          path: |
            AutoZapret-portable.zip
            checksums.txt

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            AutoZapret-portable.zip
            checksums.txt
          generate_release_notes: true
          draft: true
