name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to attach the release to (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:

  # ---------------------------------------------------------------------
  # Linux package, built on ubuntu.
  #
  # The Windows job cannot produce this correctly: chmod +x there is emulated
  # by Git for Windows and the executable bit never reaches the tarball, so a
  # release shipped with mode 0644 on AutoZapret and nfqws and the user got
  # "Permission denied" after extracting it.
  #
  # Everything else is platform-independent: dotnet publish -r linux-x64 works
  # from any host, and nfqws is a prebuilt binary from the official zapret
  # release, so no C toolchain is involved.
  # ---------------------------------------------------------------------
  linux:
    name: linux package
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      # Версия из тега, а не из csproj: иначе самообновление сравнивает
      # установленную версию с тегом и зацикливается.
      - name: Resolve version from tag
        id: version
        run: |
          TAG="${{ inputs.tag }}"
          [ -n "$TAG" ] || TAG="${{ github.ref_name }}"
          V="${TAG#v}"

          if ! echo "$V" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::tag '$TAG' is not a version (expected v1.2.3)"
            exit 1
          fi

          echo "version: $V (from tag $TAG)"
          echo "value=$V" >> "$GITHUB_OUTPUT"

      - name: Publish (self-contained, single file)
        run: |
          dotnet publish linux/AutoZapret.Linux.csproj \
            -c Release -r linux-x64 --self-contained true \
            -p:PublishSingleFile=true \
            -p:EnableCompressionInSingleFile=true \
            -p:Version=${{ steps.version.outputs.value }} \
            -p:DebugType=none -v minimal --nologo -o linux-publish

          test -f linux-publish/AutoZapret || { echo "::error::linux binary was not produced"; exit 1; }

      - name: Fetch nfqws
        run: |
          # nfqws is the same engine as winws (one codebase, different packet
          # source), so the whole strategy catalogue works unchanged.
          TAG=$(curl -sI https://github.com/bol-van/zapret/releases/latest \
                | grep -i '^location:' | sed 's|.*/tag/||' | tr -d '\r\n')
          echo "zapret: $TAG"

          curl -sL -o zapret.tar.gz \
            "https://github.com/bol-van/zapret/releases/download/$TAG/zapret-$TAG.tar.gz"
          tar xzf zapret.tar.gz

          SRC=$(find . -maxdepth 1 -type d -name 'zapret-*' | head -1)
          if [ -z "$SRC" ] || [ ! -f "$SRC/binaries/linux-x86_64/nfqws" ]; then
            echo "::error::nfqws not found in zapret $TAG - asset layout changed"
            exit 1
          fi

          mkdir -p linux-engine
          cp "$SRC/binaries/linux-x86_64/nfqws" linux-engine/nfqws
          chmod +x linux-engine/nfqws

          # Here the binary can actually be run - this is Linux, unlike the
          # Windows runner where it gave "Exec format error".
          ./linux-engine/nfqws --version | head -1

      - name: Assemble package
        run: |
          set -e

          STAGE=linux-stage
          rm -rf "$STAGE"
          mkdir -p "$STAGE/engine/bin" "$STAGE/engine/lists"

          cp linux-publish/AutoZapret "$STAGE/AutoZapret"
          cp linux-engine/nfqws "$STAGE/engine/bin/nfqws"

          # lists and fakes: same files the Windows package ships
          cp assets/lists/*.txt "$STAGE/engine/lists/"
          cp assets/fakes/*.bin "$STAGE/engine/bin/" 2>/dev/null || true

          cp -r assets "$STAGE/assets"
          cp linux/install.sh "$STAGE/install.sh"
          cp README.md "$STAGE/" 2>/dev/null || true
          cp LICENSE "$STAGE/" 2>/dev/null || true

          chmod +x "$STAGE/AutoZapret" "$STAGE/engine/bin/nfqws" "$STAGE/install.sh"

          tar czf autozapret-linux-x64.tar.gz -C "$STAGE" .
          ls -lh autozapret-linux-x64.tar.gz

          # Contents: listing to a FILE first, then grep. `tar tzf | grep -q`
          # under pipefail reports "not found" for a file that is present -
          # grep exits early, tar takes SIGPIPE, the whole pipeline fails.
          tar tzf autozapret-linux-x64.tar.gz | sed 's|^\./||' > /tmp/archive.txt

          # Everything needed to work OFFLINE: the person may have no network
          # at all, and there is nothing to download with.
          for need in AutoZapret engine/bin/nfqws install.sh \
                      assets/strategies/strategies.v1.json \
                      assets/strategies/strategies.v2.json \
                      assets/fakes/fakes.json assets/fakes/stun.bin \
                      engine/lists/ipset-all.txt engine/lists/list-general.txt \
                      assets/hosts/fixes.json assets/fixes/packs.json; do
            if ! grep -qx "$need" /tmp/archive.txt; then
              echo "::error::archive has no $need"
              head -25 /tmp/archive.txt
              exit 1
            fi
          done

          # The executable bit INSIDE the archive. This is the check whose
          # `sed 's|^\./||'` here would be wrong: in the verbose listing the
          # name is at the END of the line (`./AutoZapret`), so the prefix is
          # stripped everywhere, not only at the start.
          # absence let a release ship with 0644 on the binaries.
          tar tzvf autozapret-linux-x64.tar.gz | sed 's|\./||g' > /tmp/verbose.txt

          for need in AutoZapret engine/bin/nfqws install.sh; do
            mode=$(grep -E " ${need}$" /tmp/verbose.txt | head -1 | cut -d' ' -f1)
            case "$mode" in
              -rwx*) echo "  $need: $mode" ;;
              *) echo "::error::$need has mode '$mode' - not executable after extraction"; exit 1 ;;
            esac
          done

          # ipset must be the real list, not the one-line placeholder: with the
          # placeholder the bypass covers domain lists only and YouTube stays
          # closed while the service reports "bypass on".
          mkdir -p /tmp/x && tar xzf autozapret-linux-x64.tar.gz -C /tmp/x
          count=$(wc -l < /tmp/x/engine/lists/ipset-all.txt)
          echo "  ipset-all.txt: $count lines"
          [ "$count" -gt 1000 ] || { echo "::error::ipset-all.txt is a placeholder ($count lines)"; exit 1; }

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: linux-package
          path: autozapret-linux-x64.tar.gz
          retention-days: 7

  release:
    runs-on: windows-latest
    needs: linux

    # Тот же таймаут, что и в build.yml: очередь GitHub иногда залипает.
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # При ручном запуске собирать надо тот тег, который попросили, а не
          # ветку, с которой нажали кнопку. Иначе workflow_dispatch собирает
          # master и публикует его под чужим тегом.
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Cache WebView2 SDK
        id: cache-webview2
        uses: actions/cache@v4
        with:
          path: lib/webview2
          key: webview2-sdk-1.0.4314.35

      - name: Fetch WebView2 SDK
        if: steps.cache-webview2.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./tools/fetch-webview2.ps1

      # Версия берётся из тега, а не из csproj.
      #
      # Почему это обязательно: самообновление сравнивает установленную версию
      # с тегом релиза. Если собрать v0.3.0 с <Version>0.2.0</Version> из csproj,
      # exe навсегда рапортует 0.2.0 — приложение будет предлагать обновиться
      # до 0.3.0, обновляться и снова видеть 0.2.0. Бесконечный цикл.
      - name: Resolve version from tag
        id: version
        shell: pwsh
        run: |
          # Два пути: push тега (ref_name = v1.2.3) и ручной запуск
          # (inputs.tag = v1.2.3, а ref_name = имя ветки).
          $tag = '${{ inputs.tag }}'

          if ([string]::IsNullOrWhiteSpace($tag)) { $tag = '${{ github.ref_name }}' }

          $tag = $tag.Trim()
          $v = $tag.TrimStart('v', 'V')

          if ($v -notmatch '^\d+\.\d+\.\d+$') {
            throw "tag '$tag' is not a version (expected v1.2.3)"
          }

          Write-Host "version: $v (from tag $tag)"
          "value=$v" >> $env:GITHUB_OUTPUT
          "numeric=$v.0" >> $env:GITHUB_OUTPUT

      - name: Build
        shell: pwsh
        run: |
          dotnet build AutoZapret.csproj -c Release -v minimal --nologo `
            -p:Version=${{ steps.version.outputs.value }} `
            -p:FileVersion=${{ steps.version.outputs.numeric }} `
            -p:AssemblyVersion=${{ steps.version.outputs.numeric }}
          if ($LASTEXITCODE -ne 0) { throw "build failed" }

      - name: Selftest
        shell: pwsh
        run: |
          Push-Location bin
          try {
            $p = Start-Process -FilePath ./AutoZapret.exe -ArgumentList '--selftest' -Wait -PassThru -NoNewWindow
            if (Test-Path selftest.txt) { Get-Content selftest.txt -Encoding UTF8 | Write-Host }
            if ($p.ExitCode -ne 0) { throw "selftest failed" }
          } finally { Pop-Location }

      # Без стратегий релиз бесполезен: это половина продукта.
      - name: Verify strategies and licenses
        shell: pwsh
        run: |
          foreach ($f in @('assets/strategies/strategies.v1.json','assets/strategies/strategies.v2.json')) {
            if (-not (Test-Path $f)) { throw "missing $f" }
            $n = @((Get-Content $f -Raw -Encoding UTF8 | ConvertFrom-Json).strategies).Count
            Write-Host "$f : $n"
            if ($n -lt 20) { throw "$f has only $n strategies" }
          }

          foreach ($f in @('LICENSE','licenses/README.md','licenses/zapret-MIT.txt',
                           'licenses/flowseal-MIT.txt','licenses/WinDivert-LGPLv3.txt',
                           'licenses/zapret-custom-binaries-MIT.txt',
                           'assets/fakes/fakes.json')) {
            if (-not (Test-Path $f)) { throw "missing $f - обязательный файл поставки" }
          }

      # portable-архив: self-contained exe (.NET внутри) + loader + ассеты + ЛИЦЕНЗИИ
      #
      # Движок обязателен: без engine\ приложение запускается и показывает
      # «Движок не установлен». Раньше пакет собирался БЕЗ него, а README внутри
      # предлагал запустить tools\fetch-engine.ps1 — которого в пакете тоже нет.
      - name: Fetch engine
        shell: pwsh
        run: |
          ./tools/fetch-engine.ps1
          if (-not (Test-Path 'engine/bin/winws.exe')) {
            throw "engine not fetched - the portable package would be useless without it"
          }

      - name: Publish self-contained
        shell: pwsh
        run: |
          dotnet publish AutoZapret.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true `
            -p:EnableCompressionInSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:Version=${{ steps.version.outputs.value }} `
            -p:FileVersion=${{ steps.version.outputs.numeric }} `
            -p:AssemblyVersion=${{ steps.version.outputs.numeric }} `
            -p:DebugType=none -v minimal --nologo -o publish
          if ($LASTEXITCODE -ne 0) { throw "publish failed" }
          Copy-Item 'lib/webview2/WebView2Loader.dll' 'publish/' -Force

          # версия внутри опубликованного exe должна совпасть с тегом
          $p = Start-Process -FilePath ./publish/AutoZapret.exe -ArgumentList '--version' -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "published exe --version failed" }

      - name: Assemble portable package
        shell: pwsh
        run: |
          $stage = 'stage/AutoZapret'
          New-Item -ItemType Directory -Path $stage -Force | Out-Null

          Copy-Item 'publish/AutoZapret.exe'      $stage
          Copy-Item 'publish/WebView2Loader.dll'  $stage

          # Иконка рядом с exe: окно и трей ищут её по этому пути.
          if (Test-Path 'assets/AutoZapret.ico') {
            Copy-Item 'assets/AutoZapret.ico' $stage -Force
          }

          # ассеты и стратегии - часть продукта, без них приложение пустое
          Copy-Item 'assets' $stage -Recurse -Force

          # движок идёт ВНУТРЬ пакета: обещание «скачал и работает» иначе ложь
          if (Test-Path 'engine/bin/winws.exe') {
            New-Item -ItemType Directory -Path (Join-Path $stage 'engine') -Force | Out-Null
            robocopy engine (Join-Path $stage 'engine') /E /XO /NJH /NJS /NDL /NFL /NP /R:1 /W:1 | Out-Null
            # robocopy: 0-7 успех, 8+ ошибка
            if ($LASTEXITCODE -ge 8) { throw "engine copy failed with $LASTEXITCODE" }
            $global:LASTEXITCODE = 0
          } else {
            throw "engine missing - refusing to publish a package that cannot work"
          }

          # скрипт обновления движка кладём рядом, иначе README отправляет в пустоту
          New-Item -ItemType Directory -Path (Join-Path $stage 'tools') -Force | Out-Null
          Copy-Item 'tools/fetch-engine.ps1' (Join-Path $stage 'tools') -Force
          # лицензии обязательны (MIT/LGPL требования)
          Copy-Item 'LICENSE'   $stage -Force
          Copy-Item 'licenses'  $stage -Recurse -Force
          if (Test-Path 'README.md') { Copy-Item 'README.md' $stage -Force }

          # движок zapret НЕ шипим (ROADMAP §P1): качается tools\fetch-engine.ps1
          #
          # ВАЖНО: здесь массив строк, а не here-string (@' ... '@).
          # В YAML содержимое run: | обязано быть с отступом, а закрывающий '@
          # в PowerShell обязан быть в нулевой колонке - вместе это ломает YAML.
          $readme = @(
            'AutoZapret - portable',
            '',
            '1. Распакуйте в папку без кириллицы в пути (например C:\AutoZapret).',
            '2. Если скачивали через браузер: правый клик по архиву -> Свойства -> Разблокировать.',
            '3. Запустите AutoZapret.exe, согласитесь на UAC.',
            '',
            '.NET устанавливать НЕ нужно: он вшит в exe.',
            'Нужен только Microsoft Edge WebView2 Runtime (в Windows 11 уже есть,',
            'для Windows 10 - https://go.microsoft.com/fwlink/p/?LinkId=2124703).',
            '',
            'Движок обхода DPI (zapret) уже внутри, в папке engine\.',
            'Ничего скачивать не нужно.',
            '',
            'Обновить движок отдельно:',
            '    powershell -ExecutionPolicy Bypass -File tools\fetch-engine.ps1',
            '',
            'Это не VPN. WinDivert может вызвать реакцию антивируса - это ожидаемо.',
            '',
            'Требуется: Windows 10 1607+ / Windows 11, x64.'
          ) -join "`r`n"

          Set-Content -Path (Join-Path $stage 'READ-ME-FIRST.txt') -Value $readme -Encoding UTF8

          # Архив кладём ВМЕСТЕ с папкой, а не «содержимым папки»: с
          # `-Path "$stage/*"` PowerShell раскладывает файлы в корень архива, и
          # человек, распаковав, получает AutoZapret.exe вперемешку с assets.
          #
          # Упаковка через tools\pack-zip.ps1, а не Compress-Archive: в
          # PowerShell 5.1 он пишет обратные слеши, и такой архив распаковывается
          # в один файл вместо дерева каталогов. На раннере сейчас pwsh 7 и
          # этого не видно — но зависимость от версии PowerShell в упаковке
          # релиза нам не нужна.
          & pwsh -NoProfile -File tools/pack-zip.ps1 -Source $stage -Destination 'AutoZapret-portable.zip' -Prefix 'AutoZapret'
          if ($LASTEXITCODE -ne 0) { throw "pack-zip failed with $LASTEXITCODE" }

          $mb = [int]((Get-Item 'AutoZapret-portable.zip').Length / 1MB)
          Write-Host "package: $mb MB"
          if ($mb -lt 20) { throw "package too small ($mb MB)" }

          # проверяем содержимое архива, а не только размер
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path 'AutoZapret-portable.zip'))
          try {
            # Разделители — отдельно и до нормализации: архив с обратными
            # слешами содержит все файлы и при этом распаковывается в мусор.
            $backslash = @($zip.Entries | Where-Object { $_.FullName.Contains('\') })
            if ($backslash.Count -gt 0) {
              throw ("в архиве " + $backslash.Count + " записей с обратными слешами - распакуется в мусор")
            }

            $names = $zip.Entries | ForEach-Object { $_.FullName }

            # Всё нужное для работы БЕЗ интернета: у человека может быть плохо
            # с сетью, и докачивать ему нечем.
            foreach ($need in @('AutoZapret/AutoZapret.exe',
                                'AutoZapret/WebView2Loader.dll',
                                'AutoZapret/engine/bin/winws.exe',
                                'AutoZapret/engine/bin/winws2.exe',
                                'AutoZapret/engine/bin/WinDivert64.sys',
                                'AutoZapret/engine/lua/blobs.lua',
                                'AutoZapret/assets/strategies/strategies.v1.json',
                                'AutoZapret/assets/strategies/strategies.v2.json',
                                'AutoZapret/assets/fakes/fakes.json',
                                'AutoZapret/assets/fakes/stun.bin',
                                'AutoZapret/assets/lists/ipset-all.txt',
                                'AutoZapret/assets/lists/list-general.txt',
                                'AutoZapret/assets/hosts/fixes.json',
                                'AutoZapret/assets/fixes/packs.json',
                                'AutoZapret/tools/fetch-engine.ps1',
                                'AutoZapret/LICENSE',
                                'AutoZapret/licenses/zapret-MIT.txt',
                                'AutoZapret/licenses/zapret-custom-binaries-MIT.txt',
                                'AutoZapret/licenses/WinDivert-LGPLv3.txt')) {
              if (-not ($names -contains $need)) { throw "в архиве нет $need" }
            }
            Write-Host "содержимое архива проверено: $($names.Count) файлов"
          } finally { $zip.Dispose() }

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          # Установщик берёт файлы из stage\AutoZapret — ровно того каталога,
          # который собран для портативного архива. Отдельной сборки нет:
          # две сборки одного продукта неизбежно разъедутся.
          if (-not (Test-Path 'stage/AutoZapret/AutoZapret.exe')) {
            throw "stage/AutoZapret is missing - the portable package step must run first"
          }
          if (-not (Test-Path 'stage/AutoZapret/engine/bin/winws.exe')) {
            throw "engine is missing from the staged package - an installer without it cannot work"
          }

          $env:AUTOZAPRET_VERSION = '${{ steps.version.outputs.value }}'

          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\autozapret.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with $LASTEXITCODE" }

          $setup = Get-ChildItem 'artifacts/AutoZapret-*-setup.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $setup) { throw "installer was not produced" }

          $mb = [Math]::Round($setup.Length / 1MB, 1)
          Write-Host "$($setup.Name) -> $mb MB"
          if ($setup.Length -lt 20MB) { throw "installer too small ($mb MB)" }

          Copy-Item $setup.FullName '.' -Force

      - name: Verify installer (silent install, selftest, uninstall)
        shell: pwsh
        run: |
          $setup = (Get-ChildItem 'AutoZapret-*-setup.exe' | Select-Object -First 1).FullName
          $target = Join-Path $env:TEMP 'az-ci-install'

          if (Test-Path $target) { Remove-Item $target -Recurse -Force }

          $p = Start-Process -FilePath $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-',"/DIR=$target" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installer exited $($p.ExitCode)" }

          # Установщик, который собрался, - это не установщик, который работает.
          foreach ($rel in @('AutoZapret.exe','engine/bin/winws.exe','engine/bin/WinDivert64.sys',
                             'assets/strategies/strategies.v1.json','assets/hosts/fixes.json',
                             'assets/fixes/packs.json','WebView2Loader.dll','LICENSE','README.md')) {
            $path = Join-Path $target $rel
            if (-not (Test-Path $path)) { throw "installed copy has no $rel" }
          }

          Push-Location $target
          try {
            $s = Start-Process -FilePath (Join-Path $target 'AutoZapret.exe') -ArgumentList '--selftest' -Wait -PassThru -NoNewWindow
          } finally { Pop-Location }

          if (Test-Path (Join-Path $target 'selftest.txt')) {
            Get-Content (Join-Path $target 'selftest.txt') -Encoding UTF8 | Select-String -Pattern 'RESULT|\[FAIL\]' | ForEach-Object { Write-Host $_.Line }
          }

          if ($s.ExitCode -ne 0) { throw "selftest of the installed copy failed with $($s.ExitCode)" }

          # Версия внутри установленной копии должна совпасть с тегом, иначе
          # самообновление будет предлагать её же по кругу.
          #
          # Через Start-Process с RedirectStandardOutput, а НЕ через `& exe`:
          # AutoZapret — GUI-приложение (WinExe), у него нет консольного stdout,
          # и `& exe --version` в PowerShell возвращает пустую строку, а процесс
          # висит до таймаута job. Проверено: 30 минут тишины и cancel.
          $versionFile = Join-Path $env:TEMP 'az-installed-version.txt'
          $vp = Start-Process -FilePath (Join-Path $target 'AutoZapret.exe') `
                              -ArgumentList '--version' -Wait -PassThru -NoNewWindow `
                              -RedirectStandardOutput $versionFile

          $ver = if (Test-Path $versionFile) { (Get-Content $versionFile -Raw).Trim() } else { '' }
          Write-Host "installed version: $ver"

          if ($vp.ExitCode -ne 0) { throw "installed exe --version exited $($vp.ExitCode)" }
          if ($ver -notmatch [regex]::Escape('${{ steps.version.outputs.value }}')) {
            throw "installed version '$ver' does not match the tag"
          }

          $uninst = Join-Path $target 'unins000.exe'
          if (-not (Test-Path $uninst)) { throw "no uninstaller registered" }

          $u = Start-Process -FilePath $uninst -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if ($u.ExitCode -ne 0) { throw "uninstaller exited $($u.ExitCode)" }

          Start-Sleep -Seconds 2
          if (Test-Path (Join-Path $target 'AutoZapret.exe')) { throw "files left after uninstall" }
          Write-Host "install -> selftest -> uninstall: ok"
      # The tarball is built by the "linux" job on ubuntu and downloaded here.
      #
      # Why not build it in this job: it runs on windows-latest, where
      # `chmod +x` is emulated by Git for Windows and never reaches the
      # archive. The released tarball had AutoZapret and nfqws with mode 0644,
      # so extracting it gave "Permission denied" on ./AutoZapret. `tar --mode`
      # would fix the modes but applies a single mode to every file, README
      # included.
      - name: Download Linux package
        uses: actions/download-artifact@v4
        with:
          name: linux-package
          path: .

      - name: Checksums
        shell: pwsh
        run: |
          # Every file a user can download is hashed the same way: the portable
          # zip, the Windows installer and the Linux tarball.
          Get-ChildItem -Path 'AutoZapret-portable.zip','AutoZapret-*-setup.exe','autozapret-linux-x64.tar.gz' -File -ErrorAction SilentlyContinue |
            ForEach-Object {
              $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "$h  $($_.Name)" | Out-File -FilePath 'checksums.txt' -Encoding ASCII -Append
              Write-Host "$h  $($_.Name)"
            }

          if (-not (Test-Path 'checksums.txt')) { throw "no checksums produced" }

          $text = Get-Content 'checksums.txt' -Raw
          foreach ($need in @('AutoZapret-portable\.zip', 'AutoZapret-.*-setup\.exe', 'autozapret-linux-x64\.tar\.gz')) {
            if ($text -notmatch $need) { throw "checksums.txt has no entry matching $need" }
          }
          Write-Host "checksums.txt: all three files listed"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: win-portable-release
          path: |
            AutoZapret-portable.zip
            AutoZapret-*-setup.exe
            autozapret-linux-x64.tar.gz
            checksums.txt

      - name: Publish release
        # Ручной запуск тоже должен публиковать: иначе workflow_dispatch
        # собирает пакеты и молча ничего не выкладывает.
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            AutoZapret-portable.zip
            AutoZapret-*-setup.exe
            autozapret-linux-x64.tar.gz
            checksums.txt
          generate_release_notes: true
          draft: false
          # Пока проект до 1.0.0, каждый релиз помечается пререлизом: обещать
          # «стабильно» на 0.x нельзя. На 1.0.0 флаг снимается.
          prerelease: true
