name: build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      # WebView2 SDK качается один раз и переиспользуется между прогонами
      - name: Cache WebView2 SDK
        id: cache-webview2
        uses: actions/cache@v4
        with:
          path: lib/webview2
          key: webview2-sdk-1.0.4314.35

      - name: Fetch WebView2 SDK
        if: steps.cache-webview2.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./tools/fetch-webview2.ps1

      - name: Verify WebView2 SDK present
        shell: pwsh
        run: |
          $required = @(
            'lib/webview2/Microsoft.Web.WebView2.Core.dll',
            'lib/webview2/Microsoft.Web.WebView2.WinForms.dll',
            'lib/webview2/WebView2Loader.dll'
          )
          foreach ($f in $required) {
            if (-not (Test-Path $f)) { throw "missing: $f" }
            Write-Host "ok  $f  $((Get-Item $f).Length) bytes"
          }

      - name: Build
        shell: pwsh
        run: |
          dotnet build AutoZapret.csproj -c Release -v minimal --nologo
          if ($LASTEXITCODE -ne 0) { throw "build failed" }

      - name: Verify build output
        shell: pwsh
        run: |
          $exe = 'bin/AutoZapret.exe'
          if (-not (Test-Path $exe)) { throw "no exe produced" }
          $size = (Get-Item $exe).Length
          Write-Host "AutoZapret.exe: $size bytes"
          if ($size -lt 100000) { throw "exe suspiciously small: $size" }
          if (-not (Test-Path 'bin/WebView2Loader.dll')) { throw "WebView2Loader.dll not copied" }
          if (-not (Test-Path 'bin/AutoZapret.dll')) { throw "managed assembly missing" }
          if (-not (Test-Path 'bin/AutoZapret.runtimeconfig.json')) { throw "runtimeconfig missing" }

      # Стратегии лежат в репозитории как данные (assets/strategies/*.json).
      # Если их нет - релиз уйдёт без стратегий, а это половина продукта.
      # Проверяем ЗАРАНЕЕ, чтобы не узнать об этом после публикации.
      - name: Verify strategies are committed
        shell: pwsh
        run: |
          foreach ($f in @('assets/strategies/strategies.v1.json','assets/strategies/strategies.v2.json')) {
            if (-not (Test-Path $f)) { throw "missing $f - стратегии должны быть в репозитории" }
            $j = Get-Content $f -Raw -Encoding UTF8 | ConvertFrom-Json
            $n = @($j.strategies).Count
            Write-Host "$f : $n стратегий"
            if ($n -lt 20) { throw "$f содержит всего $n стратегий" }
          }
          # абсолютных путей быть не должно: стратегии переносимы
          $text = Get-Content 'assets/strategies/strategies.v1.json' -Raw -Encoding UTF8
          if ($text -match '[A-Za-z]:\\\\') { throw "в strategies.v1.json есть абсолютные пути" }

      # Библиотека фейков (TLSpack, MIT) - тоже данные продукта.
      - name: Verify fakes library
        shell: pwsh
        run: |
          if (-not (Test-Path 'assets/fakes/fakes.json')) { throw "нет assets/fakes/fakes.json" }
          $m = Get-Content 'assets/fakes/fakes.json' -Raw -Encoding UTF8 | ConvertFrom-Json
          $n = @($m.entries).Count
          Write-Host "фейков в манифесте: $n"
          if ($n -lt 100) { throw "в манифесте всего $n фейков" }

          $bins = @(Get-ChildItem 'assets/fakes' -Filter '*.bin')
          Write-Host "файлов .bin: $($bins.Count)"
          if ($bins.Count -lt 100) { throw "мало .bin файлов: $($bins.Count)" }

      # --selftest проверяет настройки, json, атомарную запись, ресурсы UI,
      # списки, фейки, прокси-крипто и обновления.
      #
      # Движок (engine\) в репозитории отсутствует — он в .gitignore. Поэтому
      # без него проверки движка помечаются [skip], а не [FAIL]: чистый клон
      # обязан проходить selftest. Чтобы проверить и движок, качаем его ниже
      # и запускаем с --require-engine.
      - name: Selftest (without engine)
        shell: pwsh
        run: |
          Push-Location bin
          try {
            $p = Start-Process -FilePath ./AutoZapret.exe -ArgumentList '--selftest' -Wait -PassThru -NoNewWindow
            Write-Host "exit code: $($p.ExitCode)"
            if (Test-Path selftest.txt) { Get-Content selftest.txt -Encoding UTF8 | Write-Host }
            if ($p.ExitCode -ne 0) { throw "selftest failed with $($p.ExitCode)" }
          } finally { Pop-Location }

      # Движок качается через git clone (zip блокируют антивирусы из-за WinDivert64.sys).
      # Это заодно проверяет, что tools\fetch-engine.ps1 работает на чистой машине.
      - name: Fetch engine
        shell: pwsh
        continue-on-error: true
        run: |
          ./tools/fetch-engine.ps1
          if (-not (Test-Path 'engine/bin/winws.exe')) {
            Write-Host "::warning::engine not fetched (network or upstream unavailable) - engine checks will be skipped"
            exit 0
          }
          # движок должен лежать рядом с exe
          New-Item -ItemType Directory -Path bin/engine -Force | Out-Null
          robocopy engine bin/engine /E /XO /NJH /NJS /NDL /NFL /NP /R:1 /W:1 | Out-Null

          # ВАЖНО: robocopy считает успехом коды 0-7 (1 = «файлы скопированы»),
          # а ошибкой — 8 и больше. Без этой проверки шаг падал с «exit code 1»
          # при полностью успешном копировании: pwsh возвращает код последней
          # команды, а Actions приписывает `exit $LASTEXITCODE` в конец блока.
          if ($LASTEXITCODE -ge 8) { throw "robocopy failed with $LASTEXITCODE" }
          $global:LASTEXITCODE = 0

      - name: Selftest (with engine, strict)
        if: hashFiles('engine/bin/winws.exe') != ''
        shell: pwsh
        run: |
          Push-Location bin
          try {
            $p = Start-Process -FilePath ./AutoZapret.exe -ArgumentList '--selftest','--require-engine' -Wait -PassThru -NoNewWindow
            Write-Host "exit code: $($p.ExitCode)"
            if (Test-Path selftest.txt) { Get-Content selftest.txt -Encoding UTF8 | Write-Host }
            if ($p.ExitCode -ne 0) { throw "strict selftest failed with $($p.ExitCode)" }
          } finally { Pop-Location }

      - name: Upload selftest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selftest-report
          path: bin/selftest.txt
          if-no-files-found: warn

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: AutoZapret-${{ github.sha }}
          path: |
            bin/AutoZapret.exe
            bin/AutoZapret.dll
            bin/AutoZapret.runtimeconfig.json
            bin/AutoZapret.deps.json
            bin/WebView2Loader.dll
            bin/Microsoft.Web.WebView2.Core.dll
            bin/Microsoft.Web.WebView2.WinForms.dll
          retention-days: 14

      # Self-contained сборка: .NET у пользователя не нужен. Это то, что
      # реально отдаётся людям, поэтому проверяем и её.
      - name: Publish self-contained
        shell: pwsh
        run: |
          dotnet publish AutoZapret.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true `
            -p:EnableCompressionInSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=none -v minimal --nologo -o publish
          if ($LASTEXITCODE -ne 0) { throw "publish failed" }

          # нативная библиотека WebView2 в single-file не встраивается
          Copy-Item 'lib/webview2/WebView2Loader.dll' 'publish/' -Force

          # ассеты (иконка, стратегии) publish сам не копирует
          Copy-Item 'assets' 'publish/assets' -Recurse -Force

          $exe = 'publish/AutoZapret.exe'
          if (-not (Test-Path $exe)) { throw "publish produced no exe" }
          $mb = [int]((Get-Item $exe).Length / 1MB)
          Write-Host "published exe: $mb MB"
          if ($mb -lt 20) { throw "self-contained exe too small ($mb MB) - runtime not bundled?" }
          if (-not (Test-Path 'publish/WebView2Loader.dll')) { throw "WebView2Loader.dll missing in publish" }
          if (-not (Test-Path 'publish/assets/strategies/strategies.v1.json')) { throw "strategies missing in publish" }

          # Артефакт должен запускаться как есть: без движка приложение
          # показывает «Движок не установлен» и не делает ничего полезного.
          if (Test-Path 'engine/bin/winws.exe') {
            New-Item -ItemType Directory -Path 'publish/engine' -Force | Out-Null
            robocopy engine publish/engine /E /XO /NJH /NJS /NDL /NFL /NP /R:1 /W:1 | Out-Null
            if ($LASTEXITCODE -ge 8) { throw "engine copy failed with $LASTEXITCODE" }
            $global:LASTEXITCODE = 0
            Write-Host "engine included in publish"
          } else {
            Write-Host "::warning::engine not fetched - the artifact will run without it"
          }

      - name: Upload self-contained
        uses: actions/upload-artifact@v4
        with:
          name: AutoZapret-selfcontained-${{ github.sha }}
          path: |
            publish/AutoZapret.exe
            publish/WebView2Loader.dll
            publish/assets/
            publish/engine/
          retention-days: 14
