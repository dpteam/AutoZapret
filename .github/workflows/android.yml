name: android

# Сборка APK. Отдельный workflow, а не job внутри build: Android тянет
# .NET-workload и NDK (минуты), и вешать это на каждую правку десктопа
# незачем. Запускается, когда меняется android/ или этот файл, плюс вручную.
on:
  push:
    branches: [ main, master ]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      # Workload android тянет Android SDK-таргеты и JDK-обвязку. Без него
      # net9.0-android не собирается вообще.
      - name: Install Android workload
        shell: pwsh
        run: |
          dotnet workload install android --skip-manifest-update
          if ($LASTEXITCODE -ne 0) { throw "workload install failed" }

      # hev-socks5-tunnel в git не лежит (refs/ в .gitignore): это сторонний
      # код, который качается отдельно. Без него APK соберётся, но VPN-режим
      # упадёт на P/Invoke — поэтому собираем здесь же.
      - name: Fetch hev-socks5-tunnel
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/heiher/hev-socks5-tunnel.git refs/hev-socks5-tunnel
          if ($LASTEXITCODE -ne 0) { throw "clone failed" }

          Push-Location 'refs/hev-socks5-tunnel'
          try {
            git submodule update --init --recursive --depth 1
            if ($LASTEXITCODE -ne 0) { throw "submodule init failed" }
          } finally { Pop-Location }

      - name: Build tun2socks (ndk-build)
        shell: pwsh
        run: |
          $ndk = $env:ANDROID_NDK_LATEST_HOME
          if (-not $ndk -or -not (Test-Path $ndk)) {
            $ndk = Get-ChildItem "$env:ANDROID_HOME/ndk" -Directory -ErrorAction SilentlyContinue |
                   Sort-Object Name -Descending | Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $ndk -or -not (Test-Path $ndk)) { throw "Android NDK not found on runner" }
          Write-Host "NDK: $ndk"

          Push-Location 'refs/hev-socks5-tunnel'
          try {
            & "$ndk/ndk-build" "APP_ABI=arm64-v8a x86_64" "NDK_PROJECT_PATH=." `
                "APP_BUILD_SCRIPT=Android.mk" "NDK_APPLICATION_MK=Application.mk" "-j4"
            if ($LASTEXITCODE -ne 0) { throw "ndk-build failed" }
          } finally { Pop-Location }

          # .so кладём туда, откуда их ждёт csproj (libs/ в git не лежит).
          $dst = 'android/AutoZapret.Android/libs'
          foreach ($abi in @('arm64-v8a', 'x86_64')) {
            New-Item -ItemType Directory -Path "$dst/$abi" -Force | Out-Null
            Copy-Item "refs/hev-socks5-tunnel/libs/$abi/libhev-socks5-tunnel.so" "$dst/$abi/" -Force
            Write-Host "  $abi <- libhev-socks5-tunnel.so"
          }

      # Debug, а не Release: Release требует настроенного keystore, а для
      # тестового артефакта это лишняя возня с секретами в CI.
      - name: Build APK
        shell: pwsh
        run: |
          dotnet build android/AutoZapret.Android/AutoZapret.Android.csproj `
            -c Debug -p:AndroidSdkDirectory="$env:ANDROID_HOME" -v minimal --nologo
          if ($LASTEXITCODE -ne 0) { throw "apk build failed" }

          $apk = 'android/AutoZapret.Android/bin/Debug/net9.0-android/ru.autozapret.android-Signed.apk'
          if (-not (Test-Path $apk)) { throw "APK not produced" }
          $mb = [math]::Round((Get-Item $apk).Length / 1MB, 1)
          Write-Host "APK: $mb MB"

          # Проверка, что нативная библиотека реально внутри: без неё VPN
          # запускается и падает на первом вызове hev.
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $apk))
          try {
            $native = $zip.Entries | Where-Object { $_.FullName -like '*libhev-socks5-tunnel.so' }
            if (-not $native) { throw "libhev-socks5-tunnel.so missing inside APK" }
            Write-Host "native libs in APK: $($native.Count)"
          } finally { $zip.Dispose() }

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-${{ github.sha }}
          path: android/AutoZapret.Android/bin/Debug/net9.0-android/ru.autozapret.android-Signed.apk
          retention-days: 14
